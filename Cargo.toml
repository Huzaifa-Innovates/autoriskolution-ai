[package]
name = "autoriskolution-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
helix-db = "3.0.0"
serde = { version = "1", features = ["derive"] }
rand = "0.9"
rayon = "1"
serde_json = "1.0.151"
tower-http = { version = "0.7.1", features = ["fs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
